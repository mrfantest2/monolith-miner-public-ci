name: Monolith Miner Public Android QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout approved source snapshot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests and Debug/Preview builds
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:testPreviewUnitTest :app:assembleDebug :app:assemblePreview --no-daemon --console=plain
      - name: Verify APKs and test reports
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/preview/app-preview.apk
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for variant in ("Debug", "Preview"):
              files = glob.glob(f"app/build/test-results/test{variant}UnitTest/TEST-*.xml")
              assert files, f"No reports: {variant}"
              suites = [ET.parse(p).getroot() for p in files]
              n = sum(int(x.attrib.get("tests", 0)) for x in suites)
              failures = sum(int(x.attrib.get("failures", 0)) + int(x.attrib.get("errors", 0)) for x in suites)
              print(f"{variant} tests={n} failures={failures}")
              assert n >= 20 and failures == 0, f"{variant} regression failed"
          PY
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/preview/app-preview.apk | grep "name='com.fantest.monolithminer.preview'"